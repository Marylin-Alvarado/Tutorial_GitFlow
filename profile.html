<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil de Usuario - GitFlow Demo</title>
    <link rel="stylesheet" href="profile.css">
</head>
<body>
    <div class="profile-container">
        <div class="profile-header">
            <div class="avatar">
                <img src="https://via.placeholder.com/150" alt="Avatar" id="avatarImg">
            </div>
            <h1 id="userName">Juan Pérez</h1>
            <p id="userRole">Desarrollador Full Stack</p>
        </div>
        
        <div class="profile-content">
            <div class="section">
                <h2>📋 Información Personal</h2>
                <form id="profileForm">
                    <div class="form-group">
                        <label>Nombre Completo:</label>
                        <input type="text" id="fullName" value="Juan Pérez" required>
                    </div>
                    <div class="form-group">
                        <label>Email:</label>
                        <input type="email" id="email" value="juan.perez@ejemplo.com" required>
                    </div>
                    <div class="form-group">
                        <label>Teléfono:</label>
                        <input type="tel" id="phone" value="+34 600 123 456">
                    </div>
                    <div class="form-group">
                        <label>Bio:</label>
                        <textarea id="bio" rows="4">Apasionado por el desarrollo web y las metodologías ágiles. GitFlow enthusiast.</textarea>
                    </div>
                    <button type="submit" class="btn-primary">Guardar Cambios</button>
                </form>
            </div>
            
            <div class="section">
                <h2>🔒 Seguridad</h2>
                <button class="btn-secondary" id="changePasswordBtn">Cambiar Contraseña</button>
                <button class="btn-secondary" id="enable2FABtn">Activar Autenticación 2FA</button>
            </div>
            
            <div class="section">
                <h2>📊 Estadísticas</h2>
                <div class="stats-grid">
                    <div class="stat-box">
                        <span class="stat-number">127</span>
                        <span class="stat-label">Commits</span>
                    </div>
                    <div class="stat-box">
                        <span class="stat-number">23</span>
                        <span class="stat-label">Pull Requests</span>
                    </div>
                    <div class="stat-box">
                        <span class="stat-number">89</span>
                        <span class="stat-label">Issues Resueltos</span>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="profile-footer">
            <button class="btn-back" onclick="window.location.href='dashboard.html'">← Volver al Dashboard</button>
        </div>
    </div>
    <script src="profile.js"></script>
</body>
</html>
